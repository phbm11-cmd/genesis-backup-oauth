<h1>genesis-backup</h1>
<p>Aplicativo de uso pessoal e privado. Ele envia cópias de segurança criptografadas de um servidor do próprio dono para o Google Drive do próprio dono, usando a ferramenta <a href="https://rclone.org">rclone</a>.</p>
<p>O aplicativo não é oferecido ao público e não tem outros usuários.</p>
